                                                <h2 className="text-2xl font-bold text-slate-900">Celebrations, Recognitions, & Achievements</h2>
                                            </div>
                                            <ul className="space-y-4">
                                                <li className="flex items-start space-x-3 p-3 rounded-xl bg-slate-50 border border-slate-100">
                                                    <i className="fa-solid fa-star text-amber-500 mt-1"></i>
                                                    <div>
                                                        <strong className="text-slate-900 block text-sm">New Grant Awarded (2024)</strong>
                                                        <span className="text-xs text-slate-600">Dr. Gonzalez and the FEEL Lab received internal research funding to study employee affect during AI integration.</span>
                                                    </div>
                                                </li>
                                                <li className="flex items-start space-x-3 p-3 rounded-xl bg-slate-50 border border-slate-100">
                                                    <i className="fa-solid fa-award text-amber-500 mt-1"></i>
                                                    <div>
                                                        <strong className="text-slate-900 block text-sm">Best Paper Honorable Mention</strong>
                                                        <span className="text-xs text-slate-600">Recognized at the regional Industrial-Organizational Psychology conference for work on algorithmic justice.</span>
                                                    </div>
                                                </li>
                                            </ul>
                                        </div>

                                        {/* WORD CLOUD */}
                                        <div className="bg-gradient-to-br from-indigo-50 to-purple-50 rounded-3xl p-6 sm:p-8 border border-indigo-100 shadow-sm text-center">
                                            <h2 className="text-2xl font-bold text-slate-900 mb-2">Our Lab Culture</h2>
                                            <p className="text-xs text-slate-500 mb-8">How our team members describe working together in the FEEL Lab</p>
                                            
                                            <div className="flex flex-wrap items-center justify-center gap-4 sm:gap-6 max-w-2xl mx-auto">
                                                {WORD_CLOUD_TERMS.map((term, i) => (
                                                    <span 
                                                        key={i} 
                                                        className={`${term.size} ${term.color} transition-transform hover:scale-110 cursor-default px-2 py-1`}
                                                    >
                                                        {term.text}
                                                    </span>
                                                ))}
                                            </div>
                                        </div>
                                    </section>
                                )}

                                {/* PROJECTS */}
                                {activeTab === 'projects' && (
                                    <section className="space-y-6">
                                        <div>
                                            <h2 className="text-2xl font-bold text-slate-900">Research Focus Areas & Projects</h2>
                                            <p className="text-sm text-slate-500">Click on any research area row below to expand active lab projects.</p>
                                        </div>

                                        <div className="space-y-4">
                                            {PROJECTS_CATEGORIES.map((cat) => {
                                                const isOpen = expandedProjects[cat.id];
                                                return (
                                                    <div key={cat.id} className="bg-white rounded-2xl border border-slate-200 overflow-hidden shadow-sm transition-all">
                                                        <div 
                                                            onClick={() => toggleProject(cat.id)}
                                                            className="p-6 cursor-pointer hover:bg-slate-50 flex items-center justify-between transition-colors"
                                                        >
                                                            <div className="flex items-center space-x-4">
                                                                <div className="w-12 h-12 rounded-xl bg-indigo-50 text-indigo-600 flex items-center justify-center text-xl shrink-0">
                                                                    <i className={`fa-solid ${cat.icon}`}></i>
                                                                </div>
                                                                <div>
                                                                    <div className="flex items-center space-x-2 mb-1">
                                                                        <h3 className="text-lg font-bold text-slate-900">{cat.title}</h3>
                                                                        <span className="text-xs font-bold px-2 py-0.5 bg-slate-100 text-slate-600 rounded-full">{cat.tag}</span>
                                                                    </div>
                                                                    <p className="text-xs text-slate-500 max-w-2xl">{cat.shortDesc}</p>
                                                                </div>
                                                            </div>

                                                            <div className="flex items-center space-x-3 shrink-0 ml-4">
                                                                <span className="text-xs font-semibold text-indigo-600 hidden sm:inline">
                                                                    {isOpen ? 'Collapse' : 'Expand Projects'}
                                                                </span>
                                                                <div className={`w-8 h-8 rounded-full bg-slate-100 flex items-center justify-center text-slate-600 transition-transform ${isOpen ? 'rotate-180 bg-indigo-100 text-indigo-600' : ''}`}>
                                                                    <i className="fa-solid fa-chevron-down text-xs"></i>
                                                                </div>
                                                            </div>
                                                        </div>

                                                        {isOpen && (
                                                            <div className="bg-slate-50 p-6 border-t border-slate-200 space-y-4">
                                                                <h4 className="text-xs font-bold uppercase tracking-wider text-slate-400 mb-2">Active Projects in this Area:</h4>
                                                                <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                                                                    {cat.activeProjects.map((proj, idx) => (
                                                                        <div key={idx} className="bg-white p-4 rounded-xl border border-slate-200 shadow-sm">
                                                                            <span className="text-[10px] font-extrabold uppercase px-2 py-0.5 bg-emerald-100 text-emerald-800 rounded-md">
                                                                                {proj.status}
                                                                            </span>
                                                                            <h5 className="font-bold text-slate-900 text-sm mt-2 mb-1">{proj.title}</h5>
                                                                            <p className="text-xs text-slate-500"><strong>Lead Researcher(s):</strong> {proj.lead}</p>
                                                                        </div>
                                                                    ))}
                                                                </div>
                                                            </div>
                                                        )}
                                                    </div>
                                                );
                                            })}
                                        </div>
                                    </section>
                                )}

                                {/* CURRENT TEAM */}
                                {activeTab === 'members' && (
                                    <section className="space-y-6">
                                        <div>
                                            <h2 className="text-2xl font-bold text-slate-900">Current Team</h2>
                                            <p className="text-xs text-slate-500">Click on any team member's card to view their complete breakout page!</p>
                                        </div>

                                        <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
                                            {LAB_MEMBERS.filter(m => m.type === 'current').map((member) => (
                                                <div 
                                                    key={member.id}
                                                    onClick={() => navigateTo(member.id)}
                                                    className="bg-white rounded-2xl border border-slate-200 overflow-hidden shadow-sm hover:shadow-xl transition-all cursor-pointer p-5 group flex flex-col justify-between"
                                                >
                                                    <div>
                                                        <img src={member.image} alt={member.name} className="w-full h-52 object-cover rounded-xl mb-4" />
                                                        <h3 className="font-bold text-lg text-slate-900 group-hover:text-indigo-600 transition-colors">{member.name}</h3>
                                                        <p className="text-xs font-semibold text-indigo-600 mb-2">{member.role}</p>
                                                        <p className="text-xs text-slate-600 line-clamp-3 leading-relaxed">{member.bio}</p>
                                                    </div>
                                                    <div className="pt-4 mt-4 border-t border-slate-100 flex items-center justify-between text-xs text-indigo-600 font-bold">
                                                        <span>View Breakout Page &rarr;</span>
                                                        <i className="fa-brands fa-linkedin text-slate-400 group-hover:text-sky-600 text-base"></i>
                                                    </div>
                                                </div>
                                            ))}
                                        </div>
                                    </section>
                                )}

                                {/* ALUMNI */}
                                {activeTab === 'alumni' && (
                                    <section className="space-y-6">
                                        <div>
                                            <h2 className="text-2xl font-bold text-slate-900">FEEL Lab Alumni</h2>
                                            <p className="text-xs text-slate-500">Celebrating former lab members and where they are now.</p>
                                        </div>

                                        <div className="grid grid-cols-1 sm:grid-cols-2 gap-6">
                                            {LAB_MEMBERS.filter(m => m.type === 'alumni').map((alumnus) => (
                                                <div 
                                                    key={alumnus.id}
                                                    onClick={() => navigateTo(alumnus.id)}
                                                    className="bg-white rounded-2xl p-5 border border-slate-200 shadow-sm hover:shadow-md transition-all cursor-pointer flex items-center space-x-4 group"
                                                >
                                                    <img src={alumnus.image} alt={alumnus.name} className="w-20 h-20 rounded-xl object-cover shrink-0" />
                                                    <div>
                                                        <h3 className="font-bold text-slate-900 group-hover:text-indigo-600">{alumnus.name}</h3>
                                                        <p className="text-xs text-slate-500 mb-1">{alumnus.role}</p>
                                                        <span className="text-xs font-bold text-indigo-600">View Alumni Profile &rarr;</span>
                                                    </div>
                                                </div>
                                            ))}
                                        </div>
                                    </section>
                                )}

                                {/* PUBLICATIONS */}
                                {activeTab === 'publications' && (
                                    <section className="space-y-6">
                                        <h2 className="text-2xl font-bold text-slate-900">Publications & Presentations</h2>
                                        <div className="bg-white rounded-2xl border border-slate-200 divide-y divide-slate-100 shadow-sm">
                                            {PUBLICATIONS.map((pub, idx) => (
                                                <div key={idx} className="p-6">
                                                    <span className="px-2.5 py-1 bg-indigo-100 text-indigo-800 text-xs font-bold rounded-md mr-3">{pub.year}</span>
                                                    <h3 className="font-bold text-slate-900 inline-block text-base">{pub.title}</h3>
                                                    <p className="text-sm text-slate-600 mt-1">{pub.authors}</p>
                                                    <p className="text-xs text-indigo-600 font-medium italic">{pub.journal}</p>
                                                </div>
                                            ))}
                                        </div>
                                    </section>
                                )}

                                {/* JOIN US */}
                                {activeTab === 'join' && (
                                    <section className="max-w-4xl mx-auto">
                                        <div className="bg-gradient-to-r from-amber-500 to-orange-500 rounded-3xl p-8 sm:p-10 text-white shadow-lg">
                                            <h2 className="text-3xl font-extrabold mb-4">Interested in Joining the FEEL Lab?</h2>
                                            <div className="bg-white/10 border border-white/20 rounded-2xl p-5 mb-6">
                                                <p className="text-amber-50 text-sm leading-relaxed">
                                                    *** The FEEL Lab is currently not recruiting volunteers[cite: 1]. To inquire about future openings, interested applicants should contact Dr. Manuel Gonzalez (<strong>gonzalezma@montclair.edu</strong>) roughly one month before the semester they would like to join[cite: 1]. ***
                                                </p>
                                            </div>
                                            <a href="mailto:gonzalezma@montclair.edu" className="px-6 py-3.5 bg-slate-900 hover:bg-slate-800 text-white font-bold rounded-xl text-sm inline-block shadow-md">
                                                Contact Dr. Manuel Gonzalez
                                            </a>
                                        </div>
                                    </section>
                                )}
                            </>
                        )}
                    </main>
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
